<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Tin Học 10</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
}

.quiz-container{
    width:900px;
    max-width:100%;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
}

.progress-container{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00c853,#64dd17);
    transition:0.4s;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-weight:bold;
}

.question{
    font-size:22px;
    margin-bottom:20px;
    color:#222;
}

.answers{
    display:grid;
    gap:15px;
}

.answer-btn{
    padding:15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#f1f1f1;
    font-size:17px;
    transition:0.3s;
    text-align:left;
}

.answer-btn:hover{
    background:#dbeafe;
}

.correct{
    background:#4caf50 !important;
    color:white;
}

.wrong{
    background:#f44336 !important;
    color:white;
}

#result{
    text-align:center;
    margin-top:30px;
    display:none;
}

#restartBtn{
    padding:14px 25px;
    border:none;
    background:#2196f3;
    color:white;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
}

#restartBtn:hover{
    background:#1976d2;
}
</style>
</head>

<body>

<div class="quiz-container">

<h1>QUIZ TIN HỌC 10</h1>

<div class="info">
<div>Đúng: <span id="correct">0</span></div>
<div>Sai: <span id="wrong">0</span></div>
<div>Câu: <span id="current">1</span>/50</div>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="quiz">
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
</div>

<div id="result">
<h2>Hoàn thành bài quiz!</h2>
<h3 id="finalScore"></h3>
<button id="restartBtn">Làm lại</button>
</div>

</div>

<script>

const questions = [

{
q:"Biểu thức logic chỉ nhận giá trị nào sau đây?",
a:["Đúng hoặc Sai","True hoặc False","0 hoặc 1","Yes hoặc No"],
correct:1
},

{
q:"Kiểu dữ liệu của biểu thức logic trong Python là gì?",
a:["int","float","bool","str"],
correct:2
},

{
q:"Kết quả của biểu thức 2*3//5 == 1 là:",
a:["False","True","0","1"],
correct:1
},

{
q:"Trong Python, phép so sánh khác được viết là:",
a:["<>","!="," >< ","~="],
correct:1
},

{
q:"Câu lệnh điều kiện đơn trong Python có dạng:",
a:["if điều kiện then","if điều kiện:","if (điều kiện)","if điều kiện do"],
correct:1
},

{
q:"Khối lệnh sau dấu ':' trong Python phải:",
a:["Viết hoa","Viết thường","Thụt lề","Viết trong ngoặc"],
correct:2
},

{
q:"Toán tử logic 'và' trong Python là:",
a:["&&","and","&","AND"],
correct:1
},

{
q:"Toán tử logic 'hoặc' trong Python là:",
a:["or","||","OR","+"],
correct:0
},

{
q:"Lệnh while là:",
a:["Lệnh rẽ nhánh","Lệnh lặp","Lệnh nhập dữ liệu","Lệnh xuất dữ liệu"],
correct:1
},

{
q:"While thường dùng khi:",
a:["Biết trước số lần lặp","Không biết trước số lần lặp","Không cần điều kiện","Không cần biến"],
correct:1
},

{
q:"Trong while, điều kiện được kiểm tra:",
a:["Sau khi lặp","Trước khi lặp","Không kiểm tra","Sau khi kết thúc"],
correct:1
},

{
q:"Điều gì xảy ra nếu điều kiện while luôn đúng?",
a:["Chương trình dừng","Báo lỗi cú pháp","Lặp vô hạn","Không làm gì"],
correct:2
},

{
q:"Trong while, để tránh lặp vô hạn cần:",
a:["Có print()","Có biến thay đổi","Có input()","Có dấu ngoặc"],
correct:1
},

{
q:"Danh sách trong Python được đặt trong:",
a:["()","{}","[]","<>"],
correct:2
},

{
q:"Phần tử đầu tiên của danh sách có chỉ số:",
a:["1","-1","0","2"],
correct:2
},

{
q:"Độ dài danh sách dùng hàm:",
a:["size()","len()","count()","list()"],
correct:1
},

{
q:"Lệnh thêm phần tử vào cuối danh sách là:",
a:["add()","append()","insert()","push()"],
correct:1
},

{
q:"Lệnh xoá phần tử khỏi danh sách:",
a:["remove()","delete()","erase()","clearall()"],
correct:0
},

{
q:"Lệnh insert() dùng để:",
a:["Xoá phần tử","Chèn phần tử","Sắp xếp","Đếm phần tử"],
correct:1
},

{
q:"Lệnh sort() dùng để:",
a:["Chèn dữ liệu","Sắp xếp danh sách","Xoá dữ liệu","Tìm dữ liệu"],
correct:1
},

{
q:"Lệnh reverse() dùng để:",
a:["Đảo ngược danh sách","Xoá danh sách","Sắp xếp tăng","Sắp xếp giảm"],
correct:0
},

{
q:"Xâu kí tự trong Python thuộc kiểu:",
a:["int","bool","str","float"],
correct:2
},

{
q:"Xâu kí tự được đặt trong:",
a:["[]","Dấu nháy","{}","<>"],
correct:1
},

{
q:"Kí tự đầu tiên của xâu có chỉ số:",
a:["1","-1","0","2"],
correct:2
},

{
q:"Phép nối xâu dùng toán tử:",
a:["*","+","/","%"],
correct:1
},

{
q:"Hàm chuyển xâu sang chữ hoa:",
a:["upper()","lower()","capitalize()","title()"],
correct:0
},

{
q:"Hàm chuyển xâu sang chữ thường:",
a:["upper()","lower()","case()","text()"],
correct:1
},

{
q:"Hàm count() dùng để:",
a:["Đếm số lần xuất hiện","Chèn xâu","Xoá xâu","Đảo xâu"],
correct:0
},

{
q:"Lệnh nào nhập dữ liệu từ bàn phím?",
a:["print()","input()","len()","type()"],
correct:1
},

{
q:"Lệnh print() dùng để:",
a:["Nhập dữ liệu","Xuất dữ liệu","Tính toán","So sánh"],
correct:1
},

{
q:"Trong Python, dấu chú thích là:",
a:["//","<!-- -->","#","**"],
correct:2
},

{
q:"Kiểu dữ liệu số nguyên là:",
a:["float","bool","int","str"],
correct:2
},

{
q:"Kiểu dữ liệu số thực là:",
a:["int","float","bool","str"],
correct:1
},

{
q:"Lệnh nào kiểm tra kiểu dữ liệu?",
a:["data()","check()","type()","typeof()"],
correct:2
},

{
q:"Trong Python, phép chia lấy dư là:",
a:["/","//","%",":"],
correct:2
}

];

// nhân đôi để đủ 50 câu
while(questions.length < 50){
    questions.push(...questions.slice(0,50-questions.length));
}

questions.sort(()=>Math.random()-0.5);

let currentQuestion = 0;
let correctCount = 0;
let wrongCount = 0;
let locked = false;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");

function loadQuestion(){

    locked = false;

    const q = questions[currentQuestion];

    document.getElementById("current").innerText = currentQuestion+1;

    questionEl.innerText = q.q;

    answersEl.innerHTML = "";

    let answers = q.a.map((text,index)=>({
        text:text,
        correct:index===q.correct
    }));

    answers.sort(()=>Math.random()-0.5);

    answers.forEach(ans=>{

        const btn = document.createElement("button");

        btn.classList.add("answer-btn");

        btn.innerText = ans.text;

        btn.onclick = ()=>selectAnswer(btn,ans.correct);

        answersEl.appendChild(btn);

    });

    updateProgress();
}

function selectAnswer(button,isCorrect){

    if(locked) return;

    locked = true;

    const buttons = document.querySelectorAll(".answer-btn");

    buttons.forEach(btn=>{

        if(btn.innerText === questions[currentQuestion].a[questions[currentQuestion].correct]){
            btn.classList.add("correct");
        }

    });

    if(isCorrect){

        button.classList.add("correct");
        correctCount++;

    }else{

        button.classList.add("wrong");
        wrongCount++;

    }

    document.getElementById("correct").innerText = correctCount;
    document.getElementById("wrong").innerText = wrongCount;

    setTimeout(()=>{

        currentQuestion++;

        if(currentQuestion < questions.length){

            loadQuestion();

        }else{

            showResult();

        }

    },1200);
}

function updateProgress(){

    const percent = ((currentQuestion)/questions.length)*100;

    document.getElementById("progressBar").style.width = percent + "%";
}

function showResult(){

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").innerHTML =
        "Bạn đúng " + correctCount + "/50 câu";
}

document.getElementById("restartBtn").onclick = ()=>{

    currentQuestion = 0;
    correctCount = 0;
    wrongCount = 0;

    questions.sort(()=>Math.random()-0.5);

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    document.getElementById("correct").innerText = 0;
    document.getElementById("wrong").innerText = 0;

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
